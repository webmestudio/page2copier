<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page2Copier</title>
    <link rel="stylesheet" href="glass.css" />
    <style>
      body {
        width: 356px;
        padding: 14px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .mark {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 11px;
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }

      .brand b {
        font-size: 15px;
        letter-spacing: -0.01em;
      }

      .site {
        font-size: 11px;
        color: var(--ink-faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .shell {
        padding: 13px;
      }

      .mode-note {
        font-size: 11px;
        line-height: 1.5;
        color: var(--ink-faint);
        padding: 0 2px;
        min-height: 32px;
      }

      .grid3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      details.more {
        border-radius: var(--radius);
        border: 1px solid var(--edge-soft);
        background: rgba(9, 12, 28, 0.28);
        overflow: hidden;
      }

      details.more > summary {
        cursor: pointer;
        list-style: none;
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      details.more > summary::-webkit-details-marker {
        display: none;
      }

      details.more > summary::after {
        content: '';
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--ink-faint);
        border-bottom: 2px solid var(--ink-faint);
        transform: rotate(45deg);
        transition: transform 0.2s ease;
      }

      details.more[open] > summary::after {
        transform: rotate(-135deg);
      }

      .more-body {
        padding: 2px 12px 12px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 11px;
      }

      .link {
        background: none;
        border: 0;
        color: var(--ink-faint);
        font-size: 11px;
        cursor: pointer;
        padding: 4px 2px;
      }

      .link:hover {
        color: var(--ink);
      }

      .blocked {
        display: none;
        font-size: 12px;
        line-height: 1.5;
        color: #fbbf9a;
        background: rgba(120, 60, 20, 0.28);
        border: 1px solid rgba(251, 146, 60, 0.3);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>

    <header>
      <img class="mark" src="../../icons/icon128.png" alt="" />
      <div class="brand">
        <b>Page2Copier</b>
        <span class="site" id="site">Reading tab…</span>
      </div>
      <span class="chip accent" id="presetChip" hidden>Site preset</span>
      <button class="btn icon" id="openOptions" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <div class="glass shell stack">
      <div class="blocked" id="blocked">
        Chrome does not allow extensions to read this page. Open a normal web page and try again.
      </div>

      <div class="segment" role="group" aria-label="Capture mode">
        <button id="modeText" aria-pressed="true">Text</button>
        <button id="modeSnapshot" aria-pressed="false">Snapshot</button>
      </div>
      <p class="mode-note" id="modeNote"></p>

      <div class="grid3">
        <div class="field">
          <span class="label">Paper</span>
          <select id="paper"></select>
        </div>
        <div class="field">
          <span class="label">Layout</span>
          <select id="orientation">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="field">
          <span class="label">Margin</span>
          <select id="margin"></select>
        </div>
      </div>

      <label class="switch">
        <span class="text">
          <span class="name">Fit page width</span>
          <span class="tiny">Scales the layout so nothing is cut off the right edge</span>
        </span>
        <input type="checkbox" id="fitWidth" />
        <span class="track"></span>
      </label>

      <label class="switch">
        <span class="text">
          <span class="name">Clear overlays</span>
          <span class="tiny">Drops cookie walls, chat bubbles and sticky bars</span>
        </span>
        <input type="checkbox" id="declutter" />
        <span class="track"></span>
      </label>

      <details class="more">
        <summary>More options</summary>
        <div class="more-body stack">
          <label class="switch">
            <span class="text">
              <span class="name">Reader mode</span>
              <span class="tiny">Just the article, in book typography</span>
            </span>
            <input type="checkbox" id="readerMode" />
            <span class="track"></span>
          </label>

          <label class="switch">
            <span class="text">
              <span class="name">One continuous page</span>
              <span class="tiny">No page breaks, a single tall sheet</span>
            </span>
            <input type="checkbox" id="singlePage" />
            <span class="track"></span>
          </label>

          <label class="switch">
            <span class="text">
              <span class="name">Backgrounds and colours</span>
            </span>
            <input type="checkbox" id="printBackground" />
            <span class="track"></span>
          </label>

          <label class="switch">
            <span class="text">
              <span class="name">Header and footer</span>
              <span class="tiny">Title, address and page numbers</span>
            </span>
            <input type="checkbox" id="headerFooter" />
            <span class="track"></span>
          </label>

          <label class="switch">
            <span class="text">
              <span class="name">Ask where to save</span>
            </span>
            <input type="checkbox" id="askWhereToSave" />
            <span class="track"></span>
          </label>

          <div class="field">
            <span class="label">Colour scheme</span>
            <select id="darkPages">
              <option value="keep">Keep the page as it looks</option>
              <option value="light">Ask the site for its light theme</option>
              <option value="dark">Ask the site for its dark theme</option>
            </select>
          </div>
        </div>
      </details>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn primary" id="save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="M7 10l5 5 5-5" />
            <path d="M12 15V3" />
          </svg>
          Save as PDF
        </button>

        <button class="btn primary emerald" id="saveHtml">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" />
          </svg>
          Save as HTML
        </button>

        <button class="btn primary sky" id="savePng">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
            <circle cx="9" cy="9" r="2" />
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
          </svg>
          Save as PNG
        </button>
      </div>

      <div class="actions">
        <button class="btn ghost" id="pick" title="Pick one block of the page to save as PDF">Element (PDF)</button>
        <button class="btn ghost" id="pickPng" title="Pick one block of the page to save as PNG image">Element (PNG)</button>
        <button class="btn ghost" id="pickHtml" title="Pick one block of the page to save as standalone HTML">Element (HTML)</button>
        <button class="btn ghost" id="selection" title="Save the current text selection">Selection</button>
        <button class="btn ghost" id="batch" style="grid-column: 1 / -1;" title="Save every tab in this window">All tabs</button>
      </div>

      <div class="progress" id="progressWrap" hidden><i id="progressBar"></i></div>
      <div class="status" id="status"></div>
    </div>

    <footer>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button class="link" id="savePreset">Remember for this site</button>
        <button class="link" id="clearPreset" hidden>Forget this site</button>
      </div>
      <a href="https://ko-fi.com/D4R428HJJJ" target="_blank" rel="noopener noreferrer" class="kofi-btn-sm" title="Support me on Ko-fi">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
          <path d="M23.881 8.948c-.773-4.085-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.965-1.041-2.7-.091-3.71 1.051-1.142 3.008-.844 4.349.52 1.355-1.428 3.256-1.637 4.304-.543 1.026 1.052.595 2.802-.097 3.798zm6.546-1.488c-.371.371-.871.602-1.407.652.128-1.574.148-3.064.127-4.225.864.062 1.579.527 1.83 1.258.337.981.047 1.718-.55 2.315z"/>
        </svg>
        <span>Ko-fi</span>
      </a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
